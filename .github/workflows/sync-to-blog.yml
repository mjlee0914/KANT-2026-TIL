name: Sync TIL to GitHub Pages Blog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.avif"
      - "**/*.ico"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - ".github/workflows/sync-to-blog.yml"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TIL repo
        uses: actions/checkout@v4
        with:
          path: til-repo

      - name: Checkout GitHub Pages repo
        uses: actions/checkout@v4
        with:
          repository: mjlee0914/mjlee0914.github.io
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          path: blog-repo

      - name: Copy TIL files for the blog
        run: |
          mkdir -p blog-repo/_til
          rsync -av --delete --delete-excluded \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            --exclude ".env" \
            --exclude ".python-version" \
            --exclude "README.md" \
            --exclude "pyproject.toml" \
            --exclude "uv.lock" \
            --exclude "src/" \
            --exclude "data/" \
            --exclude "archive/" \
            --exclude "*.csv" \
            --exclude "*.ipynb" \
            --exclude "*.py" \
            --exclude "*.pth" \
            --include "*/" \
            --include "*.md" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.webp" \
            --include "*.avif" \
            --include "*.ico" \
            --include "*.html" \
            --include "*.css" \
            --include "*.js" \
            --exclude "*" \
            til-repo/ blog-repo/_til/

      # A collection entry is published at /til/<month>/<note>/, while its
      # copied screenshots are served at /til/<month>/image.png.  Let authors
      # keep writing ![](image.png) next to the TIL source file; convert only
      # existing sibling image references in the blog copy to the public URL.
      - name: Fix copied TIL image links
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          image_extensions = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".avif", ".ico"}
          image_link = re.compile(r"(!\[[^\]]*\]\()([^\s)]+)(\s+(?:\"[^\"]*\"|'[^']*'))?(\))")
          updated = []

          for note in Path("blog-repo/_til").rglob("*.md"):
              original = note.read_text(encoding="utf-8")

              def public_image_link(match):
                  prefix, target, title, suffix = match.groups()
                  clean_target = target.split("?", 1)[0].split("#", 1)[0]
                  candidate = note.parent / clean_target

                  # Only a bare, local sibling image is ambiguous on a
                  # collection detail page. URLs and deliberate paths stay as-is.
                  if (
                      "/" not in clean_target
                      and Path(clean_target).suffix.lower() in image_extensions
                      and candidate.is_file()
                  ):
                      return f"{prefix}../{target}{title or ''}{suffix}"
                  return match.group(0)

              revised = image_link.sub(public_image_link, original)
              if revised != original:
                  note.write_text(revised, encoding="utf-8")
                  updated.append(str(note.relative_to("blog-repo")))

          if updated:
              print("Adjusted collection image links:")
              print("\n".join(updated))
          PY

      - name: Commit and push changes
        run: |
          cd blog-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _til

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "Sync TIL notes"
          git push
