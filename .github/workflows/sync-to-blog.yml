name: Sync TIL to GitHub Pages Blog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - ".github/workflows/sync-to-blog.yml"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TIL repo
        uses: actions/checkout@v4
        with:
          path: til-repo

      - name: Checkout GitHub Pages repo
        uses: actions/checkout@v4
        with:
          repository: mjlee0914/mjlee0914.github.io
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          path: blog-repo

      - name: Copy TIL files for the blog
        run: |
          mkdir -p blog-repo/_til
          rsync -av \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            --exclude ".env" \
            --exclude ".python-version" \
            --exclude "README.md" \
            --exclude "pyproject.toml" \
            --exclude "uv.lock" \
            --exclude "src/" \
            --exclude "data/" \
            --exclude "archive/" \
            --exclude "*.csv" \
            --exclude "*.ipynb" \
            --exclude "*.py" \
            --exclude "*.pth" \
            --include "*/" \
            --include "*.md" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.webp" \
            --exclude "*" \
            til-repo/ blog-repo/_til/

      - name: Commit and push changes
        run: |
          cd blog-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git add _til
          git commit -m "Sync TIL notes"
          git push
